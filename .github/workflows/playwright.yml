name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Docker / MySQL
      DB_NAME: giveledger
      DB_USER: giveledger_user
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_ROOT_PASS: ${{ secrets.DB_ROOT_PASS }}
      APP_ENV: development

      # Playwright
      BASE_URL: http://localhost
      API_BASE_URL: http://localhost/api
      TENANT_A_SLUG: grace-church
      TENANT_A_NAME: Grace Church
      TENANT_A_ADMIN_EMAIL: admin@grace-church.com
      TENANT_A_ADMIN_PASSWORD: ${{ secrets.TENANT_A_ADMIN_PASSWORD }}
      TENANT_B_SLUG: hope-chapel
      TENANT_B_NAME: Hope Chapel
      TENANT_B_ADMIN_EMAIL: admin@hope-chapel.com
      TENANT_B_ADMIN_PASSWORD: ${{ secrets.TENANT_B_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      - name: Wait for API health
        run: |
          TIMEOUT=60
          START=$SECONDS
          until curl -sf http://localhost/api/health; do
            echo "Waiting for API..."
            sleep 2
            if [ $((SECONDS - START)) -ge $TIMEOUT ]; then
              echo "Error: API did not respond within ${TIMEOUT}s"
              docker compose logs
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 30
